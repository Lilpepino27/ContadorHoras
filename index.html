<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horas</title>
<style>
  :root { --bg:#0b0b0c; --fg:#ececec; --muted:#6f6f76; --line:#222226; --card:#131316; --accent:#8fc9a5; --v:74,140,104; --hi:#9fcdb0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 16px 80px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  h1 { font-size:20px; font-weight:500; margin:0; text-transform:capitalize; }
  button { background:none; border:1px solid var(--line); color:var(--fg); width:36px; height:36px; border-radius:50%; font-size:16px; cursor:pointer; }
  button:hover { border-color:var(--fg); }
  .summary { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:28px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  .big { font-size:32px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; background:linear-gradient(90deg,#5f9f7a,#a8d5ba); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .formula { grid-column:1/-1; color:var(--muted); font-size:13px; }

  .cal { display:grid; grid-template-columns:repeat(7, 1fr) minmax(44px, .8fr); gap:6px; }
  .head { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; text-align:center; padding-bottom:4px; }
  .cell { background:var(--card); border:1px solid var(--line); border-radius:10px; min-height:68px; padding:6px 6px 4px; display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
  .cell.empty { background:transparent; border-color:transparent; }
  .cell { border-color:rgba(var(--v),.45); }
  .cell.today { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 14px rgba(143,201,165,.3); }
  .cell.off { background:var(--card); border-color:var(--line); }
  .num { font-size:12px; color:var(--hi); font-weight:600; }
  .cell.today .num { color:var(--accent); }
  .cell.off .num { color:var(--muted); }
  .wk { color:var(--accent); font-weight:600; border-color:rgba(143,201,165,.3); display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; border:1px dashed var(--line); font-variant-numeric:tabular-nums; }
  .wk small { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
  input { width:100%; text-align:right; background:transparent; color:var(--fg); border:1px solid transparent; border-radius:6px; padding:2px 4px; font:inherit; font-size:18px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }
  input:hover, input:focus { border-color:var(--line); outline:none; background:var(--bg); }
  input.edited { color:var(--accent); }
  .cell.off input:not(.edited) { color:var(--muted); }

  h2 { font-size:12px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:40px 0 8px; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line); }
  .row input { width:72px; font-size:15px; }
.auth { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:20px; color:var(--muted); font-size:13px; }
  .auth[hidden], .pill[hidden] { display:none; }
  .pill { width:auto; height:auto; border-radius:999px; padding:6px 14px; font-size:13px; }
  .reset { margin-top:24px; width:auto; height:auto; border-radius:8px; padding:6px 12px; font-size:13px; color:var(--muted); }

  @media (max-width:520px) {
    .cal { gap:4px; }
    .cell { min-height:56px; padding:4px; }
    input { font-size:14px; padding:2px; }
    .big { font-size:26px; }
  }
</style>
</head>
<body>
<main>
  <div class="auth" id="auth" hidden>
    <span id="who"></span>
    <button id="login" class="pill">Iniciar sesión con Google</button>
    <button id="logout" class="pill" hidden>Salir</button>
  </div>
  <header>
    <button id="prev" aria-label="Mes anterior">←</button>
    <h1 id="title"></h1>
    <button id="next" aria-label="Mes siguiente">→</button>
  </header>

  <section class="summary">
    <div class="box"><div class="label">Horas</div><div class="big" id="total">0</div></div>
    <div class="box"><div class="label">Sueldo</div><div class="big" id="salary">0 €</div></div>
    <div class="formula" id="formula"></div>
  </section>

  <div class="cal" id="cal"></div>

  <h2>Valores por defecto</h2>
  <div id="cfg"></div>
  <button class="reset" id="reset">Restablecer ediciones de este mes</button>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Pega aquí la configuración de tu proyecto de Firebase (ver instrucciones)
const firebaseConfig = {
  apiKey: "AIzaSyC5Hl0Z2D8EK_l4jHDnwmT49vv0bhnU2DY",
  authDomain: "contadorhoras-95769.firebaseapp.com",
  projectId: "contadorhoras-95769",
  appId: "1:961532841432:web:7c1f73ba674fa24f46f6ad"
};

const HEAD = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom","Sem"];
const DEFAULTS = { weekday:0, saturday:0, sunday:0, rate:0, base:0 };

const load = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let cfg = { ...DEFAULTS, ...load("wh_cfg", {}) };
let overrides = load("wh_over", {});
let view = new Date(); view.setDate(1);

const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) && n >= 0 ? n : 0; };
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const defaultFor = dow => dow === 0 ? cfg.sunday : dow === 6 ? cfg.saturday : cfg.weekday;
const hoursFor = d => { const k = key(d); return k in overrides ? overrides[k] : defaultFor(d.getDay()); };
const fmt = n => (Math.round(n*100)/100).toString().replace(".", ",");

function render() {
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById("title").textContent = view.toLocaleDateString("es-ES", { month:"long", year:"numeric" });
  const n = new Date(y, m+1, 0).getDate();
  const todayK = key(new Date());
  const cal = document.getElementById("cal");
  cal.innerHTML = HEAD.map(h => `<div class="head">${h}</div>`).join("");

  const lead = (new Date(y, m, 1).getDay() + 6) % 7; // lunes = 0
  let col = 0, weekSum = 0, total = 0;
  const empty = () => { const e = document.createElement("div"); e.className = "cell empty"; cal.appendChild(e); col++; };
  const closeWeek = () => {
    const w = document.createElement("div"); w.className = "wk";
    w.innerHTML = `<span>${fmt(weekSum)}</span><small>h</small>`;
    cal.appendChild(w); weekSum = 0; col = 0;
  };

  for (let i = 0; i < lead; i++) empty();
  for (let i = 1; i <= n; i++) {
    const d = new Date(y, m, i), k = key(d), h = hoursFor(d);
    weekSum += h; total += h;
    const cell = document.createElement("div");
    cell.className = "cell" + (k === todayK ? " today" : "") + (h === 0 ? " off" : "");
    if (h > 0) cell.style.background = `rgba(var(--v), ${(0.1 + Math.min(h, 8) / 8 * 0.3).toFixed(2)})`;
    cell.innerHTML = `<span class="num">${i}</span>`;
    const inp = document.createElement("input");
    inp.type = "text"; inp.inputMode = "decimal"; inp.value = fmt(h);
    if (k in overrides) inp.className = "edited";
    inp.onchange = () => {
      const v = num(inp.value);
      if (v === defaultFor(d.getDay())) delete overrides[k]; else overrides[k] = v;
      persist(); render();
    };
    inp.onfocus = () => inp.select();
    cell.appendChild(inp);
    cal.appendChild(cell);
    if (++col === 7) closeWeek();
  }
  if (col > 0) { while (col < 7) empty(); closeWeek(); }

  const salary = total * cfg.rate + cfg.base;
  document.getElementById("total").textContent = fmt(total) + " h";
  document.getElementById("salary").textContent = fmt(salary) + " €";
  document.getElementById("formula").textContent = `${fmt(total)} h × ${fmt(cfg.rate)} + ${fmt(cfg.base)} = ${fmt(salary)} €`;
}

function renderCfg() {
  const items = [["Lunes – Viernes (h)","weekday"],["Sábado (h)","saturday"],["Domingo (h)","sunday"],["Precio por hora (€)","rate"],["Base fija (€)","base"]];
  const box = document.getElementById("cfg");
  box.innerHTML = "";
  for (const [label, k] of items) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<div>${label}</div>`;
    const inp = document.createElement("input");
    inp.type = "text"; inp.inputMode = "decimal"; inp.value = fmt(cfg[k]);
    inp.onchange = () => { cfg[k] = num(inp.value); persist(); renderCfg(); render(); };
    inp.onfocus = () => inp.select();
    row.appendChild(inp); box.appendChild(row);
  }
}

document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth()-1); render(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth()+1); render(); };
document.getElementById("reset").onclick = () => {
  const p = `${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,"0")}-`;
  for (const k of Object.keys(overrides)) if (k.startsWith(p)) delete overrides[k];
  persist(); render();
};

const persist = () => {
  save("wh_cfg", cfg); save("wh_over", overrides);
  if (user) setDoc(doc(db, "users", user.uid), { cfg, overrides }).catch(() => {});
};

let user = null, db = null, unsub = null;
if (firebaseConfig.apiKey) {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  db = getFirestore(app);
  const $ = id => document.getElementById(id);
  $("auth").hidden = false;
  $("login").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert("No se pudo iniciar sesión: " + e.code));
  $("logout").onclick = () => signOut(auth);
  onAuthStateChanged(auth, u => {
    user = u;
    if (unsub) { unsub(); unsub = null; }
    $("login").hidden = !!u; $("logout").hidden = !u;
    $("who").textContent = u ? u.email : "";
    if (!u) return;
    unsub = onSnapshot(doc(db, "users", u.uid), snap => {
      if (snap.exists()) {
        const d = snap.data();
        cfg = { ...DEFAULTS, ...(d.cfg || {}) };
        overrides = d.overrides || {};
        save("wh_cfg", cfg); save("wh_over", overrides);
        renderCfg(); render();
      } else {
        persist(); // primera vez: sube lo que ya hay en este dispositivo
      }
    });
  });
}

renderCfg(); render();
</script>
</body>
</html>
